name: Validate generated configuration
description: Syntax, real SublinkPro conversion, rule regressions and checksum-pinned Mihomo parsing
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
      shell: bash
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ZeroDeng01/sublinkPro
        ref: 11479dacf0a73ec0e43e1ee7e811ad31136e46f9
        path: .tools/sublink
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: .tools/sublink/go.mod
        cache-dependency-path: .tools/sublink/go.sum
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.19.0'
    - run: bash ci/validate.sh
      shell: bash
