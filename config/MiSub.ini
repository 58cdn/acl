; 58cdn/acl - MiSub built-in engine / Clash-Mihomo INI rule template.
; Usage: config/MiSub.md. This is NOT a node subscription or Clash YAML.
; Keeps the 11 selected rule files and 5 groups from 58cdn-MiSub-example.ini.
; It does not reproduce Clash.private.yaml's DNS, listeners or three test groups.
; ACL4SSR attribution and licence remain in rules/ and the referenced rule files.
; ChinaCompanyIp.list is omitted: current MiSub infers ipcidr from its name,
; while this repository publishes classical text rules in that file.

[custom]
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10
ruleset=DIRECT,https://raw.githubusercontent.com/58cdn/acl/master/private/direct.list
ruleset=节点选择,https://raw.githubusercontent.com/58cdn/acl/master/private/proxy.list
ruleset=节点选择,https://raw.githubusercontent.com/58cdn/acl/master/private/unity.list
ruleset=Ai平台,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/AI.list
ruleset=Ai平台,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/OpenAi.list
ruleset=DIRECT,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/UnBan.list
ruleset=REJECT,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/BanAD.list
ruleset=节点选择,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/Telegram.list
ruleset=节点选择,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/ProxyGFWlist.list
ruleset=DIRECT,https://raw.githubusercontent.com/58cdn/acl/master/rules/providers/ChinaDomain.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=漏网之鱼,[]FINAL

custom_proxy_group=节点选择`select`[]自动选择`[]手动切换`[]DIRECT
custom_proxy_group=手动切换`select`.*
custom_proxy_group=自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=Ai平台`select`[]节点选择`[]自动选择`[]手动切换`[]DIRECT
custom_proxy_group=漏网之鱼`select`[]节点选择`[]自动选择`[]手动切换`[]DIRECT
