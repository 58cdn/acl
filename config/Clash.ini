# SublinkPro YAML template (historical .ini filename; NOT subconverter INI).
# Private entry: private.override.yaml -> build_private.py -> Clash.private.yaml / private/*.list.
# Endpoint selection: prepare_template.py --probe; see README for runtime limits.
port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - '*.ts.net'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    +.cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # Foreign DNS always uses a proxy-only group, independently of traffic rules.
  fallback:
  - https://1.1.1.1/dns-query#自动选择
  - https://dns.google/dns-query#自动选择
  - tls://1.0.0.1:853#自动选择
  fallback-filter:
    geoip: false
    ipcidr:
    - 0.0.0.0/8
    - 240.0.0.0/4
    domain:
    - +.openai.com
    - +.chatgpt.com
    - +.oaistatic.com
    - +.oaiusercontent.com
    - +.anthropic.com
    - +.claude.ai
    - +.claude.com
    - +.gemini.google.com
    - +.generativelanguage.googleapis.com
    - +.aistudio.google.com
    - +.copilot.microsoft.com
    - +.copilot.cloud.microsoft
    - +.githubcopilot.com
    - +.githubcopilot.net
    - +.copilot-proxy.githubusercontent.com
proxies: null
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 手动切换
  - DIRECT
- name: 手动切换
  type: select
  proxies:
  - __ALL_PROXIES__
- name: 自动选择
  type: select
  proxies:
  - 自动测速 CF
  - 自动测速 Google
  - 自动测速 国内
- name: Ai平台
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 手动切换
  - DIRECT
- name: 漏网之鱼
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 手动切换
  - DIRECT
- name: 自动测速 CF
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  include-all-proxies: true
  expected-status: 204
- name: 自动测速 Google
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  include-all-proxies: true
  expected-status: 204
- name: 自动测速 国内
  type: url-test
  url: https://connectivitycheck.platform.hicloud.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  include-all-proxies: true
  expected-status: 204
rules:
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- RULE-SET,PrivateDirect,DIRECT
- RULE-SET,PrivateProxy,节点选择
- RULE-SET,Unity,节点选择
- DOMAIN-SUFFIX,openai.com,Ai平台
- DOMAIN-SUFFIX,chatgpt.com,Ai平台
- DOMAIN-SUFFIX,oaistatic.com,Ai平台
- DOMAIN-SUFFIX,oaiusercontent.com,Ai平台
